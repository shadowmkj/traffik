[general]
device = "auto"
captures_dir = "captures"

[detector]
model_path = "yolo11n.pt"
conf_threshold = 0.20
imgsz = 640
classes = [2, 3, 5, 7]

[tracker]
track_activation_threshold = 0.20
lost_track_buffer = 45
minimum_matching_threshold = 0.75

[gate]
line_a_start = [49, 1287]
line_a_end   = [1881, 816]
line_b_start = [101, 1458]
line_b_end   = [2381, 797]
offset = 60

[ocr]
enabled = false
conf_threshold = 0.35
output_csv = "number_plates.csv"
